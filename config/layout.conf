# Disposition des espaces de travail du mode pentest.
# UN SEUL fichier à éditer pour changer ce qui s'ouvre et où.
#
# Format : une entrée par ligne, 3 champs séparés par « | » :
#   <workspace> | <app-id> | <commande>
#
#   workspace : numéro d'espace de travail Hyprland où placer la fenêtre.
#   app-id    : classe Wayland de la fenêtre (sert au placement ET à la
#               fermeture ciblée par 'pentest off' — ne ferme QUE ces fenêtres).
#   commande  : programme à lancer. {LAB} est remplacé par le nom du lab.
#
# Les lignes vides et celles commençant par # sont ignorées.

# Terminal principal (classe dédiée) démarrant DANS le dossier du lab, avec un
# historique de commandes propre au lab (HISTFILE), et une session tmux nommée
# par lab (attach-or-create : elle persiste même si on ferme la fenêtre).
# @TERM@ est remplacé par le terminal configuré (clé `terminal`, défaut foot) —
# voir lib/term.sh ; ne mets PAS de terminal en dur ici si tu veux rester portable.
# Ajoute tes fenêtres tmux (notes, scans, outils) dans cette session.
1|pentest-term|@TERM@ bash -lc 'd="$HOME/pentest/{LAB}"; cd "$d" 2>/dev/null; export HISTFILE="$d/history.bash"; exec tmux new-session -A -s pentest-{LAB} -c "$d"'

# Navigateur de test isolé (profil Firefox dédié, prêt pour un proxy local).
# Passe par le helper 'pentest-browser' qui crée/ouvre le profil isolé.
# Via un login shell (bash -lc) pour garantir ~/.local/bin dans le PATH.
2|pentest-browser|bash -lc 'pentest-browser {LAB}'
